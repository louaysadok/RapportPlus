name: Build Rapport+ APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true
      - name: Bypass v1 embedding check
        run: |
          sed -i 's/throwToolExit.*Android v1 embedding/print("WARN: v1 bypass") \/\/ /g' $FLUTTER_ROOT/packages/flutter_tools/lib/src/project.dart || true
          rm -f $FLUTTER_ROOT/bin/cache/flutter_tools.snapshot* || true
          flutter --version || true
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-plus-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
