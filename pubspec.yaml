name: rapport_plus
description: Rapport+ - Assistant personnel de stage intelligent. Journal offline-first, rapport professionnel en français et préparation à la soutenance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & Architecture
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.2.0
  equatable: ^2.0.5

  # Database - Offline First
  drift: ^2.14.1
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.15
  path_provider: ^2.1.2
  path: ^1.8.3

  # UI - Material 3
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_markdown: any

  # Forms & Editors
  intl: ^0.18.1
  uuid: ^4.2.1

  # Media & Files
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  record: ^5.0.4
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  video_player: ^2.8.1
  permission_handler: ^11.2.0
  mime: ^1.0.5
  open_filex: ^4.3.4
  photo_view: ^0.14.0

  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  workmanager: ^0.5.2

  # Backup & Google Drive
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.1
  google_sign_in: ^6.1.6
  extension_google_sign_in_as_googleapis_auth: ^2.0.10
  crypto: ^3.0.3

  # PDF & DOCX Generation (100% local, free)
  pdf: ^3.10.7
  printing: ^5.11.1
  archive: ^3.4.0
  xml: ^6.3.0

  # Local AI - llama.cpp bindings
  ffi: ^2.1.0
  # Note: fllama / llama_cpp_dart added via local path when model available
  # For dev without NDK, AI service gracefully degrades to rule-based engine

  # Speech-to-text offline (sherpa-onnx / whisper.cpp)
  # sherpa_onnx: ^1.8.0  # uncomment when NDK build configured

  # Utils
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  device_info_plus: ^9.1.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.14.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/models/README.md
